name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one Pages deployment at a time; a newer run replaces an older one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check

  test:
    needs: quality
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      TEST_DATA_PREFIX: qaci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Remove orphan test users
        if: always()
        run: npm run cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 7
      # Site = showcase docs + latest HTML report, published even when tests fail so the failure is visible.
      - name: Build Pages site
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp -R docs _site/docs
          cp -R playwright-report _site/report
          cp test-results/junit.xml _site/report/junit.xml
          printf '<meta http-equiv="refresh" content="0; url=docs/showcase.html">\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy-pages:
    needs: test
    if: always() && needs.test.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
